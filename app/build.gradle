plugins {
    id 'com.android.application'
}

def appVersion = new groovy.json.JsonSlurper().parse(file('../version.json'))
def appMetadata = new groovy.json.JsonSlurper().parse(file('../mobile-app.json'))
def localUpdateManifestUrl = providers.gradleProperty('maUpdateManifestUrl').getOrElse('')
def escapedUpdateManifestUrl = localUpdateManifestUrl.replace('\\', '\\\\').replace('"', '\\"')
def githubUpdateRepository = (appMetadata.update_repository ?: '').toString()
def escapedGithubUpdateRepository = githubUpdateRepository.replace('\\', '\\\\').replace('"', '\\"')
def githubUpdateRepositoryPublic = appMetadata.update_repository_public == true

android {
    namespace 'com.siny.mobilebasic'
    compileSdk 37

    // Debug builds remain development-signed unless the release script supplies
    // the existing MA signing identity. Production releases must use that identity.
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
        release {
            def signingStore = providers.environmentVariable('MA_LEGACY_KEYSTORE').orNull
            def signingAlias = providers.environmentVariable('MA_LEGACY_KEY_ALIAS').orNull
            def signingStorePassword = providers.environmentVariable('MA_LEGACY_STORE_PASSWORD').orNull
            def signingKeyPassword = providers.environmentVariable('MA_LEGACY_KEY_PASSWORD').orNull
            if (signingStore && signingAlias && signingStorePassword && signingKeyPassword) {
                storeFile file(signingStore)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId appMetadata.application_id as String
        minSdk 26
        targetSdk 35
        versionCode appVersion.version_code as int
        versionName appVersion.version as String
        buildConfigField 'String', 'LOCAL_UPDATE_MANIFEST_URL', '"' + escapedUpdateManifestUrl + '"'
        buildConfigField 'String', 'GITHUB_UPDATE_REPOSITORY', '"' + escapedGithubUpdateRepository + '"'
        buildConfigField 'boolean', 'GITHUB_UPDATE_REPOSITORY_PUBLIC', githubUpdateRepositoryPublic.toString()
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

tasks.withType(Test).configureEach {
    workingDir rootProject.projectDir
}
