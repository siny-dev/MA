plugins {
    id 'com.android.application'
}

def currentVersion = new groovy.json.JsonSlurper().parse(file('../version.json'))
def appVersionCode = (project.findProperty('appVersionCode') ?: System.getenv('APP_VERSION_CODE') ?: currentVersion.version_code).toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: System.getenv('APP_VERSION_NAME') ?: currentVersion.version).toString()
def releaseSigningValues = [
    System.getenv('ANDROID_KEYSTORE_PATH'),
    System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    System.getenv('ANDROID_KEY_ALIAS'),
    System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningConfigured = releaseSigningValues.every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.siny.mobilebasic'
    compileSdk 37

    defaultConfig {
        applicationId 'com.siny.apps.ma_3c44c3e1b8'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (!releaseSigningConfigured) {
            throw new GradleException('Signed release requires the Basic Tool release command and its locally protected signing key.')
        }
        if (appVersionCode <= 0 || !appVersionName.matches(/[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}/)) {
            throw new GradleException('Release version name/code is invalid.')
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.withType(Test).configureEach {
    workingDir rootProject.projectDir
}
